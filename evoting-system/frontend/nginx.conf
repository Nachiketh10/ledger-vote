server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path not matching a real file falls back to
    # index.html so React Router handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies API calls to the backend container (matches the dev-mode
    # Vite proxy in vite.config.js, so the frontend code needs zero
    # changes between `npm run dev` and this containerized build).
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
